<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NexusLingo — Neural Translator</title>

  <!-- PWA & Meta -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#05070d" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Fonts & CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Ambient animated backdrop -->
  <div class="grid-backdrop" aria-hidden="true"></div>
  <div class="glow-orb glow-orb--a" aria-hidden="true"></div>
  <div class="glow-orb glow-orb--b" aria-hidden="true"></div>

  <div class="app-frame">

    <!-- HUD corner brackets -->
    <span class="corner corner--tl" aria-hidden="true"></span>
    <span class="corner corner--tr" aria-hidden="true"></span>
    <span class="corner corner--bl" aria-hidden="true"></span>
    <span class="corner corner--br" aria-hidden="true"></span>

    <header class="hud-header">
      <div class="brand">
        <span class="brand__mark">◈</span>
        <h1>Nexus<span class="brand__accent">Lingo</span></h1>
      </div>
      <div class="hud-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">SYSTEM ONLINE</span>
      </div>
    </header>
    <p class="tagline">Multi-modal neural translation — text · voice · vision</p>

    <div class="container">
      <div class="cards-wrapper">

        <!-- Text Input -->
        <div class="section" id="textInputSection">
          <div class="section__head">
            <label for="textInput">Text Input</label>
            <span class="char-count" id="charCount">0 / 2000</span>
          </div>
          <textarea id="textInput" maxlength="2000" placeholder="Type or paste text to translate..."></textarea>
        </div>

        <!-- Audio Input -->
        <div class="section" id="audioInputSection" style="display: none;">
          <label>Audio Input</label>
          <div class="record-row">
            <button id="recordBtn" class="btn-primary">🎤 Record Audio</button>
            <div class="waveform" id="waveform" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
          <span id="recordStatus" class="record-status"></span>

          <label for="audioInput">Or Upload Audio File</label>
          <input type="file" id="audioInput" accept="audio/*" />
        </div>

        <!-- Image Input -->
        <div class="section" id="imageInputSection" style="display: none;">
          <label>Camera OCR</label>
          <div class="cam-row">
            <button id="startCameraBtn" class="btn-primary">📷 Start Camera OCR</button>
            <button id="stopCameraBtn" style="display: none;" class="btn-danger">⛔ Stop OCR</button>
          </div>
          <div class="cam-frame" id="camFrame" style="display:none;">
            <video id="videoFeed" autoplay muted playsinline></video>
            <canvas id="overlayCanvas"></canvas>
            <span class="cam-corner cam-corner--tl"></span>
            <span class="cam-corner cam-corner--tr"></span>
            <span class="cam-corner cam-corner--bl"></span>
            <span class="cam-corner cam-corner--br"></span>
          </div>
          <label for="imageInput">Or Upload Image</label>
          <input type="file" id="imageInput" accept="image/*" />
        </div>

        <!-- Type + Language + Translate -->
        <div class="section">
          <label for="inputType">Input Mode</label>
          <select id="inputType">
            <option value="text">Text</option>
            <option value="audio">Audio</option>
            <option value="image">Image</option>
          </select>

          <div class="lang-row">
            <div class="lang-field">
              <label for="sourceLang">From</label>
              <select id="sourceLang">
                <option value="auto">Auto-detect</option>
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="zh">Chinese</option>
                <option value="hi">Hindi</option>
              </select>
            </div>

            <button id="swapBtn" class="btn-swap" title="Swap languages" aria-label="Swap languages">⇄</button>

            <div class="lang-field">
              <label for="targetLang">To</label>
              <select id="targetLang">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="zh">Chinese</option>
                <option value="hi">Hindi</option>
              </select>
            </div>
          </div>

          <button id="translateBtn" class="btn-translate">
            <span class="btn-translate__ring" aria-hidden="true"></span>
            <span class="btn-translate__label"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-translate" viewBox="0 0 16 16">
  <path d="M4.545 6.714 4.11 8H3l1.862-5h1.284L8 8H6.833l-.435-1.286zm1.634-.736L5.5 3.956h-.049l-.679 2.022z"/>
  <path d="M0 2a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v3h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-3H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h7a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1zm7.138 9.995q.289.451.63.846c-.748.575-1.673 1.001-2.768 1.292.178.217.451.635.555.867 1.125-.359 2.08-.844 2.886-1.494.777.665 1.739 1.165 2.93 1.472.133-.254.414-.673.629-.89-1.125-.253-2.057-.694-2.82-1.284.681-.747 1.222-1.651 1.621-2.757H14V8h-3v1.047h.765c-.318.844-.74 1.546-1.272 2.13a6 6 0 0 1-.415-.492 2 2 0 0 1-.94.31"/>
</svg> Translate</span>
          </button>
        </div>

        <!-- Output + Voice + History -->
        <div class="section">
          <div class="section__head">
            <label for="output">Translation Output</label>
            <span class="detect-badge" id="detectBadge" style="display:none;"></span>
          </div>
          <div id="output">Your translated text will appear here.</div>

          <div class="output-actions">
            <button id="speakBtn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-megaphone" viewBox="0 0 16 16">
  <path d="M13 2.5a1.5 1.5 0 0 1 3 0v11a1.5 1.5 0 0 1-3 0v-.214c-2.162-1.241-4.49-1.843-6.912-2.083l.405 2.712A1 1 0 0 1 5.51 15.1h-.548a1 1 0 0 1-.916-.599l-1.85-3.49-.202-.003A2.014 2.014 0 0 1 0 9V7a2.02 2.02 0 0 1 1.992-2.013 75 75 0 0 0 2.483-.075c3.043-.154 6.148-.849 8.525-2.199zm1 0v11a.5.5 0 0 0 1 0v-11a.5.5 0 0 0-1 0m-1 1.35c-2.344 1.205-5.209 1.842-8 2.033v4.233q.27.015.537.036c2.568.189 5.093.744 7.463 1.993zm-9 6.215v-4.13a95 95 0 0 1-1.992.052A1.02 1.02 0 0 0 1 7v2c0 .55.448 1.002 1.006 1.009A61 61 0 0 1 4 10.065m-.657.975 1.609 3.037.01.024h.548l-.002-.014-.443-2.966a68 68 0 0 0-1.722-.082z"/>
</svg> Speak</button>
            <button id="copyBtn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-clipboard" viewBox="0 0 16 16">
  <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1z"/>
  <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0z"/>
</svg> Copy</button>
            <button id="clearBtn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eraser" viewBox="0 0 16 16">
  <path d="M8.086 2.207a2 2 0 0 1 2.828 0l3.879 3.879a2 2 0 0 1 0 2.828l-5.5 5.5A2 2 0 0 1 7.879 15H5.12a2 2 0 0 1-1.414-.586l-2.5-2.5a2 2 0 0 1 0-2.828zm2.121.707a1 1 0 0 0-1.414 0L4.16 7.547l5.293 5.293 4.633-4.633a1 1 0 0 0 0-1.414zM8.746 13.547 3.453 8.254 1.914 9.793a1 1 0 0 0 0 1.414l2.5 2.5a1 1 0 0 0 .707.293H7.88a1 1 0 0 0 .707-.293z"/>
</svg> Clear</button>
            <button id="showHistoryBtn"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-list" viewBox="0 0 16 16">
  <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
</svg> History</button>
          </div>

          <div id="history" class="history-panel">
            <div class="history-panel__head">
              <span>Recent Translations</span>
              <button id="downloadHistoryBtn" class="btn-ghost">⬇ Export</button>
              <button id="clearHistoryBtn" class="btn-ghost">✕ Clear</button>
            </div>
            <div id="historyList"></div>
          </div>
        </div>

      </div>

      <!-- PWA Install -->
      <button id="installBtn" style="display: none;">📲 Install App</button>
    </div>
  </div>

  <!-- Toasts -->
  <div id="toastStack" class="toast-stack" aria-live="polite"></div>

  <!-- OCR Library + App Script -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v4/dist/tesseract.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
